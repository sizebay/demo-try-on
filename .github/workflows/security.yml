name: Security

on:
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (gitleaks, PR commits only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan commits introduced by this PR
        run: gitleaks detect --source . --redact --no-banner --log-opts="origin/${{ github.base_ref }}..HEAD"
